<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker></defs><text x="88" y="66" fill="#111111" font-size="32" font-weight="600">求职管道管理下一步，不收藏机会</text><text x="88" y="98" fill="#666666" font-size="16">岗位、联系人、面试和复盘要能继续推进</text><line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8" stroke-width="1"/><line x1="130" y1="370" x2="1070" y2="370" stroke="#222222" stroke-width="1"/><line x1="130" y1="370" x2="1070" y2="370" stroke="#E8E8E8" stroke-width="6"/><circle cx="310" cy="370" r="6" fill="#2F6BFF"/><circle cx="500" cy="370" r="6" fill="#2F6BFF"/><circle cx="690" cy="370" r="6" fill="#2F6BFF"/><circle cx="880" cy="370" r="6" fill="#2F6BFF"/><text x="210" y="315" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">岗位</text><text x="210" y="405" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">发现</text><text x="400" y="315" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">评估</text><text x="400" y="405" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">匹配和风险</text><text x="590" y="315" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">表达</text><text x="590" y="405" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">简历和沟通</text><text x="780" y="315" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">面试</text><text x="780" y="405" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">准备和复盘</text><rect x="940" y="330" width="150" height="80" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1"/><text x="1015" y="365" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">下一步</text><text x="1015" y="390" text-anchor="middle" fill="#2F6BFF" font-size="13" font-weight="400">继续推进</text><path d="M900 370 C920 320 940 320 960 350" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><text x="600" y="558" text-anchor="middle" fill="#999999" font-size="14" font-weight="400">每一步都留下下一步</text></g></svg>
